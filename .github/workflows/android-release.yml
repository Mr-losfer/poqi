name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: 依赖与测试
        run: |
          flutter pub get
          flutter test

      - name: 构建 APK
        run: flutter build apk --release --split-per-abi

      - name: 生成校验与重命名
        id: artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "out/poqi-$VERSION-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "out/poqi-$VERSION-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "out/poqi-$VERSION-x86_64.apk" || true
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: Poqi ${{ steps.artifact.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            out/*.apk
            out/SHA256SUMS.txt
