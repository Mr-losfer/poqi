name: poqi
description: "Poqi — 把散落的影像收进一只盒子。局域网 MCP 驱动的影视聚合与插件平台。"
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0
  crypto: ^3.0.5
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  html: ^0.15.4
  intl: ^0.19.0
  open_filex: ^4.5.0
  package_info_plus: ^8.1.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  video_player: ^2.9.2
  flutter_js: ^0.8.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
